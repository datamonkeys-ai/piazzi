name: Piazzi
options:
  bundleIdPrefix: ai.datamonkeys
  deploymentTarget: { iOS: "17.0" }
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}   # export DEVELOPMENT_TEAM=<seu Team ID> antes do xcodegen
    CODE_SIGN_STYLE: Automatic
    CLANG_CXX_LANGUAGE_STANDARD: c++17
targets:
  Piazzi:
    type: application
    platform: iOS
    sources:
      - path: Piazzi
        excludes: [Example/**, Example]
      # exemplo embutido (ZTF + Gaia DR3) como pasta: chega ao bundle em Example/
      - path: Piazzi/Example
        type: folder
        buildPhase: resources
      - path: ../cpp/src
        excludes: [main_cli.cpp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.datamonkeys.piazzi
        SWIFT_OBJC_BRIDGING_HEADER: Piazzi/Piazzi-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../cpp/include
        TARGETED_DEVICE_FAMILY: "1,2,6"
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Piazzi/Piazzi-mac.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en
        INFOPLIST_KEY_CFBundleLocalizations: "en pt-BR"
        INFOPLIST_KEY_CFBundleAllowMixedLocalizations: YES
        INFOPLIST_KEY_CFBundleDisplayName: Piazzi
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: "0.2.1"
        CURRENT_PROJECT_VERSION: "1"
