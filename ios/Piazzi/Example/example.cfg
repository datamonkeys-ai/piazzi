; Piazzi — example session (ZTF, asteroid (5157) Hindemith, 2021-02-06). Loaded by "Open example".
; Settings are read by astro_load_cfg; the [Example] keys describe the session for the apps.
[Example]
example_images = ztf_hindemith_0.fits;ztf_hindemith_1.fits;ztf_hindemith_2.fits
example_catalog = gaia_dr3.tsv
example_ra = 07 11 43.534
example_dec = +22 24 17.78
; example data — not your observation: the apps block MPC submission while this is set
example_no_submit = 1

[Camera]
focal_length_mm = 3063
pixel_width_mm = 0.015
pixel_height_mm = 0.015
flip_horizontal = 1
flip_vertical = 0
time_reference = 0
saturation = 60000

[Plate]
catalog = 7
catalog_faint_mag = 19.0

[Reports]
; deliberately no real observatory code: never submit example data to the MPC
mpc_code = XXX
observer = Example data (ZTF)
measurer = Piazzi example
